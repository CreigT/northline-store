name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northline
          POSTGRES_PASSWORD: northline
          POSTGRES_DB: northline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northline -d northline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://northline:northline@localhost:5432/northline
      TEST_DATABASE_URL: postgresql://northline:northline@localhost:5432/northline
      AUTH_SECRET: test-secret-test-secret-test-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm exec prisma validate
      - run: npm exec prisma generate
      - run: npm exec prisma migrate deploy
      - run: npm test
