<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order — Northline</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="wrap">
<header class="nav"><a class="brand" href="/">Northline</a><nav class="nav-links"><a href="/">Home</a><a href="/shop">Shop</a></nav></header>
<section class="band"><h1>Your receipt</h1><p>Save the order code. Card numbers are not on this page.</p><article class="card" data-order><h3>NL-1001</h3><p>Field mug · $28</p><p>Paid. Ships in 3 days.</p></article></section>
<section class="card"><h3>Need the money back?</h3><p>Enter the code and the amount. A hold stops every refund. Over $20, the owner confirms. The refund is finished in Stripe.</p><form data-refund><label>Order code</label><input name="orderId" value="NL-1001" required><label>Amount</label><input name="amount" type="number" min="1" step="0.01" value="28" required><p class="error" data-refund-error></p><button class="btn" type="submit">Request refund</button></form></section>
</div>
<script src="/js/orders.js"></script>
</body>
</html>
