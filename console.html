<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Owner console</title><link rel="stylesheet" href="/css/styles.css"></head><body><div class="wrap"><header class="nav"><a href="/">Northline</a></header><section class="card" data-gate><h1>Open the console</h1><p>You are responsible. This key is the emergency stop.</p><form data-unlock><label>Owner key</label><input name="code" type="password" required><p class="error" data-error></p><button class="btn" type="submit">Unlock</button></form></section><section class="hidden" data-panel><h1>Console</h1><p>Pause is the STORE_PAUSED variable. Refund hold is REFUNDS_HELD. A price over 15% asks again.</p><form data-price><label>Product id</label><input name="id" value="field-mug"><label>New price</label><input name="price" type="number" step="0.01" required><p data-price-error></p><button class="btn" type="submit">Check price</button></form><form data-stock><label>Product id</label><input name="id" value="amber-oil"><label>Count</label><input name="stock" type="number" required><p data-stock-error></p><button class="btn" type="submit">Set stock</button></form><form data-ship><label>Order code</label><input name="id" value="NL-1001"><label>Note</label><input name="note" placeholder="Sent"><p data-ship-error></p><button class="btn" type="submit">Mark sent</button></form></section></div><script src="/js/app.js"></script></body></html>
